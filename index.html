    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          if (typeof currentFetch === 'function') {
            var proto = window;
            while (proto && !Object.getOwnPropertyDescriptor(proto, 'fetch')) {
              proto = Object.getPrototypeOf(proto);
            }
            var desc = proto ? Object.getOwnPropertyDescriptor(proto, 'fetch') : null;
            if (!desc || (desc.get && !desc.set)) {
              Object.defineProperty(window, 'fetch', {
                get: function() { return currentFetch; },
                set: function(fn) { currentFetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          // Silent catch for sandboxed environments
        }
      })();
    </script>
